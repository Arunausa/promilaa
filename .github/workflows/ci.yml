name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate --schema=apps/frontend/prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://neondb_owner:npg_0AtjJzrf5elc@ep-holy-moon-ayyubz6w.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require"
      
    - name: Lint Next.js App
      run: npm run lint --workspace=apps/frontend
      
    - name: Typecheck Backend
      run: npm run build --workspace=apps/backend
      
    - name: Build Next.js App
      run: npm run build --workspace=apps/frontend
      env:
        DATABASE_URL: "postgresql://neondb_owner:npg_0AtjJzrf5elc@ep-holy-moon-ayyubz6w.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require"
        NEXT_PUBLIC_API_BASE_URL: "https://promilaa.vercel.app"
